services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makemeshort
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=change-me-to-a-super-secret-jwt-key-32-chars-min
      - BASE_URL=http://localhost:3000
      - DB_PATH=/app/data/makemeshort.sqlite
    volumes:
      - makemeshort_data:/app/data

volumes:
  makemeshort_data:
    driver: local
