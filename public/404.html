<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Not Found — MakeMeShort</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .error-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-card {
      max-width: 520px;
      padding: 3.5rem 2.5rem;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      color: var(--primary);
      margin-bottom: 1rem;
      letter-spacing: -2px;
    }
    .error-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.75rem;
      letter-spacing: -0.4px;
    }
    .error-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.65;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <div class="navbar-wrapper">
    <header class="navbar container">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
          </svg>
        </div>
        <span>MakeMeShort</span>
      </a>
    </header>
  </div>

  <main class="container error-wrapper">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Link Not Found or Inactive</h1>
      <p class="error-desc">
        The short link you are attempting to visit does not exist, has been removed by the creator, or is temporarily deactivated.
      </p>
      <a href="/" class="btn btn-primary btn-lg">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Return to Home & Shorten Links
      </a>
    </div>
  </main>

</body>
</html>
